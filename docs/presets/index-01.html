<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --paper:#efeee8; --ink:#131410; --sage:#7b8461; --mute:rgba(19,20,16,.48); --line:rgba(19,20,16,.18); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--paper); color:var(--ink); }
  body { font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; }
  .frame { position:absolute; inset:0; padding:7vmin; display:flex; flex-direction:column; overflow:hidden; }

  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:4vmin;
         font:500 1.5vmin/1.5 "Courier New", monospace; letter-spacing:.19em; text-transform:uppercase; }
  .top .right { text-align:right; }
  .top .live { display:inline-block; width:1.2vmin; height:1.2vmin; border-radius:50%; background:var(--sage);
               margin-right:1vmin; vertical-align:middle; animation:fade .5s .3s both; }
  .rule { height:1px; background:var(--ink); margin-top:2.4vmin; transform-origin:left;
          animation:draw 1s .2s cubic-bezier(.2,.8,.2,1) both; }

  .hero { position:relative; flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; }

  .kicker { display:flex; align-items:center; gap:1.6vmin; margin-bottom:1.6vmin;
            font:500 1.6vmin/1 "Courier New", monospace; letter-spacing:.22em; text-transform:uppercase; color:var(--mute);
            animation:fade .7s .8s both; }
  .kicker i { width:10vmin; height:1px; background:var(--sage); display:block; }

  .numeral { display:flex; align-items:flex-end; gap:2.2vmin; line-height:.72; letter-spacing:-.07em;
             font-weight:800; font-size:30vmin; text-transform:none; }
  .numeral .mask { overflow:hidden; padding-bottom:1vmin; }
  .numeral span { display:block; transform:translateY(108%); animation:rise 1.35s .45s cubic-bezier(.16,.84,.2,1) both; }
  .numeral .one span { color:var(--sage); animation-delay:.6s; }
  .caption { margin:3.4vmin 0 0; max-width:44vmin;
             font:500 1.45vmin/1.75 "Courier New", monospace; letter-spacing:.1em; text-transform:uppercase;
             color:var(--mute); animation:fade .8s 1.3s both; }
  .caption b { color:var(--ink); font-weight:700; }

  .list { position:relative; margin-top:4vmin; border-top:1px solid var(--ink); flex:none; }
  .track { position:absolute; left:0; top:0; bottom:0; width:6.4vmin; border-right:1px solid var(--line); }
  .dot { position:absolute; left:2.5vmin; top:2.2vmin; width:1.4vmin; height:1.4vmin; border-radius:50%;
         background:var(--sage); animation:stepDot 9s 2.2s both; }
  .dot::after { content:''; position:absolute; inset:-1.1vmin; border:1px solid var(--sage); border-radius:50%;
                opacity:.4; }
  .rowwrap { padding-left:8.6vmin; }
  .row { display:grid; grid-template-columns:1.3fr 2.3fr 1fr; align-items:center; gap:2vmin;
         height:5.8vmin; border-bottom:1px solid var(--line); overflow:hidden;
         font:500 1.62vmin/1 "Courier New", monospace; letter-spacing:.14em; text-transform:uppercase; }
  .row > span { display:block; transform:translateY(115%); animation:riseRow .75s both; }
  .row .n { color:var(--mute); font-size:1.45vmin; }
  .row .t { font-size:1.95vmin; letter-spacing:.1em; }
  .row .m { text-align:right; color:var(--mute); font-size:1.4vmin; }
  .r1 > span { animation-delay:1.55s }
  .r2 > span { animation-delay:1.75s }
  .r3 > span { animation-delay:1.95s }
  .r4 > span { animation-delay:2.15s }
  .r4 { border-bottom:1px solid var(--ink); }

  .foot { margin-top:3.4vmin; flex:none; }
  .bar { height:2px; background:var(--ink); transform-origin:left; position:relative;
         animation:draw 1.4s 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .bar::after { content:''; position:absolute; left:0; width:38%; top:0; bottom:0; background:var(--sage);
                transform-origin:left; animation:draw 1.1s 1.9s cubic-bezier(.2,.8,.2,1) both; }
  .footnote { display:flex; justify-content:space-between; align-items:baseline; gap:4vmin; margin-top:1.5vmin;
              font:500 1.25vmin/1.6 "Courier New", monospace; letter-spacing:.16em; text-transform:uppercase;
              color:var(--mute); animation:fade .7s 2.3s both; }
  .footnote b { color:var(--ink); font-weight:700; }

  @keyframes draw { from { transform:scaleX(0) } to { transform:scaleX(1) } }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  @keyframes grow { from { transform:scaleY(0) } to { transform:scaleY(1) } }
  @keyframes rise { from { transform:translateY(115%) } to { transform:translateY(0) } }
  @keyframes riseRow { from { transform:translateY(320%) } to { transform:translateY(0) } }
  @keyframes stepDot {
    0%, 19%   { transform:translateY(0) }
    20%, 39%  { transform:translateY(5.8vmin) }
    40%, 59%  { transform:translateY(11.6vmin) }
    60%, 100% { transform:translateY(17.4vmin) }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="top">
    <div>Index of<br>movements</div>
    <div class="right"><span class="live"></span>Archive 01<br>Nine seconds</div>
  </div>
  <div class="rule"></div>

  <div class="hero">
    <div class="kicker"><i></i><span>A short taxonomy</span></div>
    <div class="numeral">
      <div class="mask"><span>0</span></div>
      <div class="mask one"><span>1</span></div>
    </div>
    <div class="caption"><b>Four gestures</b> — recorded flat,<br>in one frame.</div>
  </div>

  <div class="list">
    <div class="track"><div class="dot"></div></div>
    <div class="rowwrap">
      <div class="row r1"><span class="n">01</span><span class="t">Form</span><span class="m">1.8s</span></div>
      <div class="row r2"><span class="n">02</span><span class="t">Rhythm</span><span class="m">2.2s</span></div>
      <div class="row r3"><span class="n">03</span><span class="t">Silence</span><span class="m">3.0s</span></div>
      <div class="row r4"><span class="n">04</span><span class="t">Exit</span><span class="m">1.0s</span></div>
    </div>
  </div>

  <div class="foot">
    <div class="bar"></div>
  </div>
  <div class="footnote"><span><b>Fig. 01</b> — scale 1:1</span><span>Archive / 2026</span></div>
</div>
</body>
</html>
