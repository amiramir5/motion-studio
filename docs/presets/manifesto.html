<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --bone:#e9e1d0; --ink:#14130f; --red:#d33c22; --cream:#f3ead8; --mute:rgba(20,19,15,.5); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bone); color:var(--ink); }
  body { font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; }
  .frame { position:absolute; inset:0; padding:6vmin 7vmin; display:flex; flex-direction:column; overflow:hidden; }

  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:4vmin; flex:none; z-index:6;
         font:500 1.4vmin/1.6 "Courier New", monospace; letter-spacing:.2em; text-transform:uppercase;
         animation:fade .5s .25s both; }
  .top .right { text-align:right; }
  .top b { font-weight:700; }

  .stage { position:relative; flex:1; min-height:0; display:flex; flex-direction:column;
           justify-content:center; }

  .disc { position:absolute; right:-24vmin; top:10%; width:62vmin; height:62vmin; border:2.2vmin solid var(--ink);
          border-radius:50%; z-index:0; opacity:0;
          animation:pop .42s .95s cubic-bezier(.2,1.2,.4,1) both; }

  .beam { position:absolute; left:-32%; width:164%; height:10.5vmin; background:var(--red); z-index:1;
          transform-origin:left center; animation:beamA 8s .3s cubic-bezier(.2,1,.3,1) both; }
  .beam.b { top:auto; bottom:17%; height:2.2vmin; background:var(--ink);
            animation:beamB 8s .62s cubic-bezier(.2,1,.3,1) both; }
  .beam.a { top:24%; }
  .beam .notch { position:absolute; right:14%; top:50%; width:3vmin; height:3vmin; background:var(--bone);
                 transform:translateY(-50%) rotate(45deg); }

  .vert { display:none; }

  .type { position:relative; z-index:3; margin-top:6vmin; }
  .kicker { display:inline-flex; align-items:center; gap:1.4vmin; margin-bottom:2.6vmin;
            font:700 1.5vmin/1 "Courier New", monospace; letter-spacing:.24em; text-transform:uppercase;
            animation:fade .5s 1.05s both; }
  .kicker i { width:4.4vmin; height:2.2vmin; background:var(--red); display:block; }

  .line { display:block; overflow:hidden; padding-bottom:.6vmin; margin:0;
          font-size:15vmin; line-height:.83; letter-spacing:-.055em; font-weight:900; text-transform:uppercase; }
  .line span { display:block; transform:translateY(112%);
               animation:cut .48s cubic-bezier(.72,0,.18,1) both; }
  .l1 span { animation-delay:1.25s }
  .l2 span { animation-delay:1.55s; -webkit-text-stroke:.25vmin var(--ink); color:transparent; }
  .l3 { position:relative; margin:1.2vmin -7vmin 0; padding:1.1vmin 7vmin 1.5vmin; overflow:hidden; }
  .l3::before { content:''; position:absolute; inset:0; background:var(--red); transform-origin:left center;
                animation:bandIn .55s 1.92s cubic-bezier(.2,1,.3,1) both; }
  .l3 span { position:relative; z-index:1; color:var(--cream); animation-delay:2.05s; }

  .sub { display:flex; justify-content:space-between; align-items:flex-end; gap:4vmin; margin-top:3.6vmin; }
  .sub p { margin:0; max-width:42vmin; font:500 1.45vmin/1.75 "Courier New", monospace; letter-spacing:.1em;
           text-transform:uppercase; color:var(--mute); }
  .sub p b { color:var(--ink); font-weight:700; }
  .sub p span { display:block; opacity:0; animation:fade .55s both; }
  .sub p span:nth-child(1) { animation-delay:3.15s }
  .sub p span:nth-child(2) { animation-delay:3.32s }
  .sub p span:nth-child(3) { animation-delay:3.49s }

  .mark { display:flex; align-items:center; gap:1.1vmin; opacity:0; animation:fade .5s 3.7s both; }
  .mark i { width:1.2vmin; height:1.2vmin; background:var(--red); }
  .mark i:nth-child(2) { background:var(--ink) }
  .mark i:nth-child(3) { background:transparent; box-shadow:0 0 0 1px var(--ink) inset }
  .mark span { font:500 1.25vmin/1 "Courier New", monospace; letter-spacing:.2em; text-transform:uppercase; }

  .foot { display:flex; justify-content:space-between; align-items:baseline; gap:4vmin; flex:none; z-index:6;
          border-top:1.5px solid var(--ink); padding-top:2.2vmin; margin-top:2.4vmin;
          font:500 1.3vmin/1.6 "Courier New", monospace; letter-spacing:.16em; text-transform:uppercase;
          animation:fade .6s 3.9s both; }
  .foot b { color:var(--red); font-weight:700; }

  @media (min-aspect-ratio: 4/5) and (max-aspect-ratio: 1/1) {
    .beam.b { bottom:13%; }
  }
  @media (min-aspect-ratio: 1/1) {
    .beam.b { display:none; }
  }

  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  @keyframes pop { from { opacity:0; transform:scale(1.35) } to { opacity:1; transform:scale(1) } }
  @keyframes beamA {
    0% { transform:rotate(-16deg) translateX(-112%) }
    7% { transform:rotate(-16deg) translateX(0) }
    100% { transform:rotate(-16.7deg) translateX(0) }
  }
  @keyframes beamB {
    0% { transform:rotate(9deg) translateX(112%) }
    8% { transform:rotate(9deg) translateX(0) }
    100% { transform:rotate(8.4deg) translateX(0) }
  }
  @keyframes cut { from { transform:translateY(112%) } to { transform:translateY(0) } }
  @keyframes bandIn { from { transform:scaleX(.06) } to { transform:scaleX(1) } }
</style>
</head>
<body>
<div class="frame">
  <div class="top">
    <div>Manifesto<br><b>No. 07</b></div>
    <div class="right">Two colours<br>One diagonal</div>
  </div>

  <div class="stage">
    <div class="disc"></div>
    <div class="beam a"><i class="notch"></i></div>
    <div class="beam b"></div>

    <div class="type">
      <div class="kicker"><i></i>Against the quiet page</div>
      <h1 class="line l1"><span>Form</span></h1>
      <h1 class="line l2"><span>Follows</span></h1>
      <h1 class="line l3"><span>Force</span></h1>

      <div class="sub">
        <p>
          <span>Nothing decorative.</span>
          <span>Everything deliberate.</span>
          <span>Held for eight seconds.</span>
        </p>
        <div class="mark" aria-hidden="true"><i></i><i></i><i></i><span>1923</span></div>
      </div>
    </div>
  </div>

  <div class="foot">
    <span>Print / <b>2 colours</b></span>
    <span>Sheet 07 — 2026</span>
  </div>
</div>
</body>
</html>
