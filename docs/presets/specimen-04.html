<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --paper:#eee9dd; --ink:#1b1d1a; --red:#cf3f27; --mute:rgba(27,29,26,.5); --line:rgba(27,29,26,.22); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--paper); color:var(--ink); }
  body { font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; }
  .frame { position:absolute; inset:0; padding:6vmin 7vmin; display:flex; flex-direction:column; overflow:hidden; }

  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:4vmin;
         font:500 1.45vmin/1.5 "Courier New", monospace; letter-spacing:.18em; text-transform:uppercase; }
  .top .right { text-align:right; }
  .top b { font-weight:700; }
  .rule { height:1px; background:var(--ink); margin-top:2vmin; transform-origin:left;
          animation:draw .9s .15s cubic-bezier(.2,.8,.2,1) both; }

  .stage { position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  .draw { width:100%; height:100%; overflow:visible; }

  .ink { stroke:var(--ink); fill:none; }
  .thin { stroke-width:1.3; }
  .hair { stroke-width:1; opacity:.5; }
  .dashed { stroke-dasharray:5 7; opacity:.35; stroke-width:1; }
  .accent { stroke:var(--red); fill:none; stroke-width:2.2; }
  .drawn { stroke-dasharray:1; stroke-dashoffset:1; }
  .d1 { animation:drawIn 1.5s .4s cubic-bezier(.3,.6,.2,1) both; }
  .d2 { animation:drawIn 1.2s .75s cubic-bezier(.3,.6,.2,1) both; }
  .d3 { animation:drawIn .9s 1s cubic-bezier(.3,.6,.2,1) both; }
  .d4 { animation:drawIn 1.7s 2.1s cubic-bezier(.4,.1,.2,1) both; }
  .d5 { animation:drawIn 1.1s 3.3s cubic-bezier(.2,.7,.2,1) both; }
  .callout { animation:drawIn .6s both; }
  .callout path { stroke-dasharray:1; }
  .c1 { animation-delay:4.1s }
  .c2 { animation-delay:4.35s }
  .dimticks { opacity:0; animation:fade .4s 3.7s both; }

  .ticks { opacity:0; animation:fade .7s 1.55s both; }
  .crossed { opacity:0; animation:fade 1s 1.2s both; }

  .needle { transform-box:view-box; transform-origin:310px 330px;
            animation:swing 2.6s 2.35s cubic-bezier(.32,1.24,.38,1) both, fade .4s 1.9s both; }
  .needle line { stroke:var(--red); stroke-width:3.4; stroke-linecap:round; }
  .needle .tail { stroke-width:5.5; opacity:.9; }

  .num { font:500 13px "Courier New", monospace; fill:var(--ink); letter-spacing:1.6px; opacity:0;
         animation:fade .6s both; }
  .n1 { animation-delay:2.9s } .n2 { animation-delay:3.05s } .n3 { animation-delay:3.2s }
  .anno { font:500 12.5px "Courier New", monospace; fill:var(--ink); letter-spacing:1.4px; text-transform:uppercase;
          opacity:0; animation:fade .6s both; }
  .a1 { animation-delay:4.45s } .a2 { animation-delay:4.7s }
  .anno .soft { fill:var(--mute); letter-spacing:1.2px; }
  .dim { font:500 15px "Courier New", monospace; fill:var(--ink); letter-spacing:2px;
         paint-order:stroke; stroke:var(--paper); stroke-width:7px; opacity:0; animation:fade .6s 3.9s both; }
  .anchor { fill:var(--red); opacity:0; animation:fade .4s 5.4s both; }
  .anchorRing { stroke:var(--red); fill:none; stroke-width:1.4; opacity:0; animation:fade .5s 5.6s both; }
  .labelA { font:700 12px "Courier New", monospace; fill:var(--red); letter-spacing:1px; opacity:0;
            animation:fade .5s 5.9s both; }

  .stamp { position:absolute; right:1vmin; bottom:2vmin; padding:1.9vmin 2.6vmin; border:2px solid var(--red);
           color:var(--red); transform:rotate(-7deg); text-align:center; opacity:0;
           font:700 1.6vmin/1.5 "Courier New", monospace; letter-spacing:.22em; text-transform:uppercase;
           animation:stampIn .32s 7.1s cubic-bezier(.2,1.4,.4,1) both; }
  .stamp i { display:block; font-style:normal; font-size:1.15vmin; letter-spacing:.3em; opacity:.8; margin-top:.5vmin; }

  .titleblock { flex:none; position:relative; display:flex; align-items:flex-end; justify-content:space-between; gap:3vmin;
                border-top:1px solid var(--ink); padding-top:2.6vmin; }
  .title { margin:0; font-size:13vmin; line-height:.82; letter-spacing:-.055em; font-weight:800; overflow:hidden; }
  .title span { display:block; transform:translateY(112%); animation:rise 1.1s .55s cubic-bezier(.16,.84,.2,1) both; }
  .titleblock .meta { text-align:right; font:500 1.4vmin/1.8 "Courier New", monospace; letter-spacing:.15em;
                      text-transform:uppercase; color:var(--mute); padding-bottom:1vmin; flex:none;
                      animation:fade .7s 2.4s both; }
  .titleblock .meta b { color:var(--ink); font-weight:700; display:block; font-size:1.9vmin; letter-spacing:.1em; }

  .foot { display:flex; justify-content:space-between; align-items:baseline; gap:4vmin; margin-top:2.8vmin; flex:none;
          font:500 1.3vmin/1.6 "Courier New", monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--mute); }
  .foot b { color:var(--ink); }

  @keyframes draw { from { transform:scaleX(0) } to { transform:scaleX(1) } }
  @keyframes drawIn { from { stroke-dashoffset:1 } to { stroke-dashoffset:0 } }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  @keyframes rise { from { transform:translateY(112%) } to { transform:translateY(0) } }
  @keyframes swing { from { transform:rotate(-122deg) } to { transform:rotate(24deg) } }
  @keyframes stampIn { from { opacity:0; transform:rotate(-16deg) scale(1.7) } to { opacity:1; transform:rotate(-7deg) scale(1) } }
</style>
</head>
<body>
<div class="frame">
  <div class="top">
    <div>Technical plates<br><b>Plate 04</b></div>
    <div class="right">Dial assembly<br>Unit: millimetres</div>
  </div>
  <div class="rule"></div>

  <div class="stage">
    <svg class="draw" viewBox="0 0 620 760" preserveAspectRatio="xMidYMid meet" aria-label="Technical drawing of a dial mechanism">
      <g class="crossed">
        <line class="ink dashed" x1="34" y1="330" x2="586" y2="330"></line>
        <line class="ink dashed" x1="310" y1="70" x2="310" y2="600"></line>
      </g>

      <circle class="ink thin drawn d1" pathLength="1" cx="310" cy="330" r="240"></circle>
      <circle class="ink thin drawn d2" pathLength="1" cx="310" cy="330" r="172"></circle>
      <circle class="ink hair drawn d3" pathLength="1" cx="310" cy="330" r="96"></circle>
      <circle class="ink dashed" cx="310" cy="330" r="256"></circle>

      <path id="ticks" class="ink hair" d=""></path>

      <path class="accent drawn d4" pathLength="1" d="M132,432 A205 205 0 1 1 487,432"></path>

      <circle class="ink thin" cx="310" cy="330" r="17"></circle>
      <circle cx="310" cy="330" r="6" fill="var(--ink)"></circle>

      <g class="needle">
        <line x1="310" y1="330" x2="310" y2="180"></line>
        <line class="tail" x1="310" y1="330" x2="310" y2="366"></line>
      </g>

      <text class="num n1" x="112" y="454" text-anchor="middle">0</text>
      <text class="num n2" x="310" y="574" text-anchor="middle">50</text>
      <text class="num n3" x="508" y="454" text-anchor="middle">100</text>

      <g class="ink thin">
        <line class="drawn d5" pathLength="1" x1="70" y1="570" x2="70" y2="700"></line>
        <line class="drawn d5" pathLength="1" x1="550" y1="570" x2="550" y2="700"></line>
        <line class="drawn d5" pathLength="1" x1="58" y1="684" x2="562" y2="684"></line>
      </g>
      <g class="dimticks">
        <line class="ink" x1="70" y1="676" x2="70" y2="692" style="stroke-width:2"></line>
        <line class="ink" x1="550" y1="676" x2="550" y2="692" style="stroke-width:2"></line>
      </g>
      <text class="dim" x="310" y="676" text-anchor="middle">Ø 480</text>

      <g class="callout c1">
        <path class="ink hair" pathLength="1" d="M494,176 L560,133"></path>
        <text class="anno a1" x="556" y="122" text-anchor="end">A — R 240</text>
        <text class="anno a1 soft" x="556" y="139" text-anchor="end">machined edge</text>
      </g>
      <g class="callout c2">
        <path class="ink hair" pathLength="1" d="M188,208 L74,150"></path>
        <text class="anno a2" x="70" y="143">B — datum</text>
        <text class="anno a2 soft" x="70" y="160">0.02 tolerance</text>
      </g>

      <circle class="anchor" cx="494" cy="176" r="6"></circle>
      <circle class="anchorRing" cx="494" cy="176" r="16"></circle>
      <text class="labelA" x="514" y="172">A</text>
    </svg>

    <div class="stamp"><span>Approved</span><i>No. 04 / 0.02 mm</i></div>
  </div>

  <div class="titleblock">
    <h1 class="title"><span>Specimen</span></h1>
    <div class="meta"><b>04 — Dial</b>Brass, one face<br>Drawn at 1:1</div>
  </div>

  <div class="foot">
    <span>Every mark is a measurement.</span>
    <span><b>Sheet 1 of 1</b></span>
  </div>
</div>

<script>
  (function () {
    var parts = [];
    for (var i = 0; i <= 60; i++) {
      var a = (150 + i * 4) * Math.PI / 180;
      var outer = 234;
      var inner = i % 5 === 0 ? 218 : 225;
      parts.push(
        'M' + (310 + Math.cos(a) * inner).toFixed(2) + ',' + (330 + Math.sin(a) * inner).toFixed(2) +
        'L' + (310 + Math.cos(a) * outer).toFixed(2) + ',' + (330 + Math.sin(a) * outer).toFixed(2)
      );
    }
    document.getElementById('ticks').setAttribute('d', parts.join(' '));
  })();
</script>
</body>
</html>
