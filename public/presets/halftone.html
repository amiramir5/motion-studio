<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --paper:#f2ede2; --ink:#17201d; --orange:#e4552e; --blue:#27506b; --mute:rgba(23,32,29,.52); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--paper); color:var(--ink); }
  body { font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; }
  .frame { position:absolute; inset:0; padding:7vmin; display:flex; flex-direction:column; overflow:hidden; }

  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:4vmin;
         font:500 1.5vmin/1.5 "Courier New", monospace; letter-spacing:.18em; text-transform:uppercase; }
  .top .right { text-align:right; }
  .top b { font-weight:700; }
  .rule { height:1px; background:var(--ink); margin-top:2.4vmin; transform-origin:left;
          animation:draw .9s .15s cubic-bezier(.2,.8,.2,1) both; }

  .stage { position:relative; flex:1; min-height:0; }

  .disc { position:absolute; left:50%; top:48%; width:72vmin; height:72vmin; margin:-36vmin 0 0 -36vmin;
          animation:settle 1.4s .3s cubic-bezier(.16,.84,.2,1) both; }
  .spin { position:absolute; inset:0; animation:turn 8s 1.1s cubic-bezier(.3,.1,.3,1) both; }
  .dots { position:absolute; inset:0; }
  .dots i { position:absolute; display:block; border-radius:50%; }
  .dots.a i { background:var(--orange); }
  .dots.a { clip-path:circle(0% at 50% 50%); animation:reveal 1.5s .45s cubic-bezier(.2,.8,.2,1) both; }
  .blue { position:absolute; inset:0; mix-blend-mode:multiply;
          animation:register 1.9s 2.15s cubic-bezier(.2,.8,.2,1) both; }
  .dots.b i { background:var(--blue); }
  .dots.b { clip-path:circle(0% at 50% 50%); animation:reveal 1.5s 1.05s cubic-bezier(.2,.8,.2,1) both; }

  .ring { position:absolute; inset:-1.1vmin; border:1px solid rgba(23,32,29,.28); border-radius:50%;
          animation:fade .8s 2.6s both; }

  .reg { position:absolute; width:5vmin; height:5vmin; animation:fade .6s 2.7s both; }
  .reg::before, .reg::after { content:''; position:absolute; background:var(--ink); }
  .reg::before { left:50%; top:0; bottom:0; width:1px; }
  .reg::after { top:50%; left:0; right:0; height:1px; }
  .reg.tl { left:0; top:0; transform:translate(-70%,-70%); }
  .reg.br { right:0; bottom:0; transform:translate(70%,70%); }

  .note { position:absolute; left:0; top:0; max-width:24vmin;
          font:500 1.32vmin/1.8 "Courier New", monospace; letter-spacing:.12em; text-transform:uppercase;
          color:var(--mute); animation:fade .8s 3.1s both; }
  .note b { color:var(--ink); font-weight:700; }
  .note .swatch { display:inline-block; width:1.2vmin; height:1.2vmin; background:var(--orange);
                  margin-right:.8vmin; vertical-align:middle; }
  .note .swatch.b { background:var(--blue); }

  .titleblock { flex:none; position:relative; }
  .title { margin:0; font-size:12.5vmin; line-height:.86; letter-spacing:-.058em; font-weight:800;
           overflow:hidden; }
  .title span { display:block; transform:translateY(112%); animation:rise 1.15s .7s cubic-bezier(.16,.84,.2,1) both; }
  .title em { font-style:normal; color:var(--orange); }
  .subrow { display:flex; justify-content:space-between; align-items:flex-end; gap:4vmin; margin-top:2.4vmin; }
  .subrow .line { font:500 1.45vmin/1.7 "Courier New", monospace; letter-spacing:.16em; text-transform:uppercase;
                  color:var(--mute); animation:fade .7s 1.5s both; }
  .subrow .line b { color:var(--ink); font-weight:700; }

  .bar { display:flex; gap:.8vmin; align-items:flex-end; animation:fade .6s 3.4s both; }
  .bar i { width:3.4vmin; height:3.4vmin; display:block; }
  .bar i:nth-child(1) { background:var(--orange); }
  .bar i:nth-child(2) { background:var(--blue); }
  .bar i:nth-child(3) { background:#2c2b24; }
  .bar i:nth-child(4) { background:var(--paper); box-shadow:0 0 0 1px var(--ink) inset; }
  .bar i:nth-child(5) { background:var(--ink); }

  .foot { display:flex; justify-content:space-between; align-items:baseline; gap:4vmin;
          border-top:1px solid var(--ink); padding-top:2.1vmin; margin-top:3.2vmin; flex:none;
          font:500 1.32vmin/1.6 "Courier New", monospace; letter-spacing:.16em; text-transform:uppercase; }
  .foot .hint { color:var(--mute); animation:fade .7s 4s both; }

  @media (aspect-ratio: 1 / 1) {
    .disc { width:52vmin; height:52vmin; margin:-26vmin 0 0 -26vmin; top:50%; }
    .note { top:1.5vmin; }
  }

  @keyframes draw { from { transform:scaleX(0) } to { transform:scaleX(1) } }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  @keyframes rise { from { transform:translateY(112%) } to { transform:translateY(0) } }
  @keyframes reveal { from { clip-path:circle(0% at 50% 50%) } to { clip-path:circle(76% at 50% 50%) } }
  @keyframes settle { from { opacity:0; transform:scale(.9) } to { opacity:1; transform:scale(1) } }
  @keyframes turn { from { transform:rotate(-1.6deg) } to { transform:rotate(2.4deg) } }
  @keyframes register {
    0% { transform:translate(4.2%, 2.6%) }
    55% { transform:translate(-.9%, -.6%) }
    100% { transform:translate(1.3%, .7%) }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="top">
    <div>Riso study<br><b>Two passes</b></div>
    <div class="right">Plate 03<br>Orange over blue</div>
  </div>
  <div class="rule"></div>

  <div class="stage">
    <div class="disc">
      <div class="spin">
        <div class="ring"></div>
        <div class="dots a"></div>
        <div class="blue"><div class="dots b"></div></div>
      </div>
      <div class="reg tl"></div>
      <div class="reg br"></div>
    </div>
    <div class="note">
      <span class="swatch"></span>Halftone, 26 × 26<br>
      <span class="swatch b"></span>Overprint, 1.2 mm<br>
      <b>No gradient used</b>
    </div>
  </div>

  <div class="titleblock">
    <h1 class="title"><span>Half<em>tone</em></span></h1>
    <div class="subrow">
      <div class="line"><b>Light becomes ink</b><br>and ink becomes a field.</div>
      <div class="bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </div>

  <div class="foot">
    <span>Printed flat, in two passes.</span>
    <span class="hint">Pull 03 / 50</span>
  </div>
</div>

<script>
  (function () {
    var COLS = 26, ROWS = 26, R = 0.5, MAX = 5.2;

    function build(host, filter) {
      var frag = document.createDocumentFragment();
      for (var ry = 0; ry < ROWS; ry++) {
        for (var rx = 0; rx < COLS; rx++) {
          var x = (rx + 0.5) / COLS;
          var y = (ry + 0.5) / ROWS;
          var dx = x - 0.5, dy = y - 0.47;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d > R) continue;
          if (filter && !filter(x, y, d)) continue;
          var size = MAX * Math.pow(1 - d / R, 0.55);
          if (size < 0.24) continue;
          var dot = document.createElement('i');
          dot.style.left = (x * 100).toFixed(3) + '%';
          dot.style.top = (y * 100).toFixed(3) + '%';
          dot.style.width = size.toFixed(3) + '%';
          dot.style.height = size.toFixed(3) + '%';
          dot.style.transform = 'translate(-50%,-50%)';
          frag.appendChild(dot);
        }
      }
      host.appendChild(frag);
    }

    build(document.querySelector('.dots.a'));
    build(document.querySelector('.dots.b'), function (x, y) {
      return x * 0.6 + y * 0.8 > 0.68;
    });
  })();
</script>
</body>
</html>
