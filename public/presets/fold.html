<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --bone:#eae3d6; --ink:#1a1714; --clay:#c65a3a; --mute:rgba(26,23,20,.55); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bone); color:var(--ink); }
  body { font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; }
  .frame { position:absolute; inset:0; padding:7vmin; display:flex; flex-direction:column; overflow:hidden; }

  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:4vmin;
         font:500 1.5vmin/1.55 "Courier New", monospace; letter-spacing:.18em; text-transform:uppercase; }
  .top .right { text-align:right; }
  .top b { font-weight:700; }
  .rule { height:1px; background:var(--ink); transform-origin:left; margin-top:2.4vmin;
          animation:draw 1s .15s cubic-bezier(.2,.8,.2,1) both; }

  .stage { position:relative; flex:1; min-height:0; margin-top:1vmin; }

  .sun { position:absolute; left:-7vmin; top:16%; width:48vmin; height:48vmin; border-radius:50%;
         background:var(--clay); transform-origin:center; animation:sunIn 1.8s .25s cubic-bezier(.16,.8,.2,1) both; }
  .sun::after { content:''; position:absolute; inset:-2.2vmin; border:1px solid rgba(26,23,20,.22); border-radius:50%; }

  .arc { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .arc .trail { fill:none; stroke:rgba(26,23,20,.62); stroke-width:2; stroke-linecap:round;
                vector-effect:non-scaling-stroke; stroke-dasharray:10 8;
                clip-path:inset(0 100% 0 0);
                animation:wipe 3.4s 2.15s cubic-bezier(.4,.05,.25,1) both; }
  .arc .mark { fill:var(--clay); opacity:0; animation:fade .5s 5.5s both; }

  .flyer { position:absolute; left:36%; top:46%; width:38vmin; height:24vmin;
           animation:fly 8.2s 1.5s cubic-bezier(.4,.05,.3,1) both; }
  .plane { position:absolute; inset:0; transform-style:preserve-3d; transform:rotate(-6deg);
           animation:bank 8.2s 1.5s cubic-bezier(.4,.05,.3,1) both; }
  .wing { position:absolute; inset:0; background:var(--clay); backface-visibility:visible; }
  .wing.a { clip-path:polygon(100% 50%, 4% 0, 30% 50%); transform-origin:100% 50%;
            animation:unfoldA 2.2s .5s cubic-bezier(.3,.75,.25,1) both; }
  .wing.b { clip-path:polygon(100% 50%, 4% 100%, 30% 50%); transform-origin:100% 50%;
            background:#b34e31; animation:unfoldB 2.2s .62s cubic-bezier(.3,.75,.25,1) both; }
  .spine { position:absolute; inset:0; clip-path:polygon(100% 49%, 2% 45%, 2% 55%, 100% 51%);
           background:var(--ink); opacity:.9; animation:fade .5s 1.9s both; }
  .crease { position:absolute; left:27%; top:50%; width:26%; height:1px; background:rgba(26,23,20,.3);
            transform-origin:right; animation:crease 1.4s 2.1s both; }

  .target { position:absolute; right:9%; top:16%; width:9vmin; height:9vmin; opacity:0;
            animation:targetIn .6s 7.1s both; }
  .target i { position:absolute; inset:0; border:1px solid var(--ink); border-radius:50%; }
  .target i:nth-child(2) { inset:2.1vmin; border-style:dashed; border-color:rgba(26,23,20,.4);
                           animation:spin 11s 7.4s linear infinite; }
  .target i:nth-child(3) { inset:3.9vmin; background:var(--clay); border:0; }

  .words { position:relative; height:17vmin; margin-top:2.6vmin; flex:none; }
  .word { position:absolute; left:0; bottom:0; margin:0; font-size:16.5vmin; line-height:.84;
          letter-spacing:-.06em; font-weight:800; text-transform:uppercase; white-space:nowrap; }
  .w1 { animation:sayOne 10s both; }
  .w2 { animation:sayTwo 10s both; color:var(--clay); }
  .w3 { animation:sayThree 10s both; }
  .index { position:absolute; right:0; bottom:2.4vmin; text-align:right;
           font:500 1.4vmin/1.9 "Courier New", monospace; letter-spacing:.18em; text-transform:uppercase; color:var(--mute); }
  .index b { color:var(--ink); font-weight:700; }

  .foot { display:flex; justify-content:space-between; align-items:baseline; gap:4vmin;
          border-top:1px solid var(--ink); padding-top:2.2vmin; margin-top:1.2vmin; flex:none;
          font:500 1.35vmin/1.6 "Courier New", monospace; letter-spacing:.16em; text-transform:uppercase; }
  .foot .hint { color:var(--mute); }
  .foot .hint b { color:var(--clay); font-weight:700; animation:fade .6s 7.4s both; }

  @keyframes draw { from { transform:scaleX(0) } to { transform:scaleX(1) } }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  @keyframes sunIn { from { opacity:0; transform:scale(.42) } to { opacity:1; transform:scale(1) } }
  @keyframes wipe { from { clip-path:inset(0 100% 0 0) } to { clip-path:inset(0 0 0 0) } }
  @keyframes unfoldA { from { transform:rotateX(88deg) } to { transform:rotateX(-9deg) } }
  @keyframes unfoldB { from { transform:rotateX(-88deg) } to { transform:rotateX(11deg) } }
  @keyframes crease { from { transform:scaleX(0) } to { transform:scaleX(1) } }
  @keyframes bank { 0% { transform:rotate(-6deg) } 40% { transform:rotate(-11deg) } 100% { transform:rotate(-3deg) } }
  @keyframes fly {
    0%   { transform:translate(-5vmin, 9vmin) }
    18%  { transform:translate(0, 4.5vmin) }
    42%  { transform:translate(7vmin, -4.5vmin) }
    70%  { transform:translate(16vmin, -14vmin) }
    90%  { transform:translate(24vmin, -21vmin); opacity:1 }
    100% { transform:translate(30vmin, -25vmin); opacity:0 }
  }
  @keyframes targetIn { from { opacity:0; transform:scale(.5) } to { opacity:1; transform:scale(1) } }
  @keyframes spin { from { transform:rotate(0) } to { transform:rotate(360deg) } }
  @keyframes sayOne {
    0%, 2% { opacity:0; transform:translateY(42%) }
    8% { opacity:1; transform:none }
    31% { opacity:1; transform:none }
    35% { opacity:0; transform:translateY(-32%) }
    100% { opacity:0; transform:translateY(-32%) }
  }
  @keyframes sayTwo {
    0%, 33% { opacity:0; transform:translateY(42%) }
    39% { opacity:1; transform:none }
    61% { opacity:1; transform:none }
    65% { opacity:0; transform:translateY(-32%) }
    100% { opacity:0; transform:translateY(-32%) }
  }
  @keyframes sayThree {
    0%, 63% { opacity:0; transform:translateY(42%) }
    69% { opacity:1; transform:none }
    94% { opacity:1; transform:none }
    100% { opacity:1; transform:none }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="top">
    <div>Fold study<br><b>No. 01</b></div>
    <div class="right">Paper, light<br>2.4 g / sheet</div>
  </div>
  <div class="rule"></div>

  <div class="stage">
    <svg class="arc" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path class="trail" d="M6,86 C24,71 34,45 49,38 C64,31 82,31 93,20"></path>
      <circle class="mark" cx="93" cy="20" r=".9"></circle>
    </svg>
    <div class="sun"></div>
    <div class="target" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="flyer">
      <div class="plane">
        <div class="wing b"></div>
        <div class="wing a"></div>
        <div class="spine"></div>
        <div class="crease"></div>
      </div>
    </div>
  </div>

  <div class="words">
    <h1 class="word w1">Fold</h1>
    <h1 class="word w2">Throw</h1>
    <h1 class="word w3">Glide</h1>
    <div class="index">Fig. 01<br><b>Lift &amp; drift</b></div>
  </div>

  <div class="foot">
    <span>A sheet becomes a wing.</span>
    <span class="hint"><b>Release</b> at 45°</span>
  </div>
</div>
</body>
</html>
