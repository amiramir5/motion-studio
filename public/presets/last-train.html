<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --paper:#f2eee5; --ink:#111110; --red:#e23d28; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--paper); color:var(--ink); }
  body { font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; }
  .frame { position:absolute; inset:0; padding:7vmin; display:flex; flex-direction:column; overflow:hidden; }

  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:4vmin; flex:none;
         font:500 1.55vmin/1.5 "Courier New", monospace; letter-spacing:.2em; text-transform:uppercase; }
  .top .right { text-align:right; }
  .rule { height:1px; background:var(--ink); transform-origin:left; margin-top:2.4vmin; flex:none;
          animation:draw 1.1s .1s cubic-bezier(.2,.8,.2,1) both; }

  .mast { position:relative; margin-top:5.5vmin; z-index:2; flex:none; }
  .mask { overflow:hidden; }
  h1 { margin:0; font-size:22.5vmin; line-height:.83; letter-spacing:-.065em; font-weight:800; text-transform:uppercase; }
  .l1 { animation:rise 1.05s .3s cubic-bezier(.2,.86,.2,1) both; }
  .l2 { color:var(--red); animation:rise 1.05s .5s cubic-bezier(.2,.86,.2,1) both; }
  .sub { display:flex; gap:3vmin; margin-top:3.2vmin;
         font:500 1.6vmin/1 "Courier New", monospace; letter-spacing:.2em; text-transform:uppercase;
         animation:fade .7s 1.25s both; }
  .sub i { width:6vmin; height:1px; background:var(--ink); display:block; align-self:center; }

  .ghost { position:absolute; right:2vmin; top:38%; width:42vmin; height:42vmin; z-index:0;
           color:transparent; -webkit-text-stroke:1px rgba(17,17,16,.17); font-weight:800;
           font-size:42vmin; line-height:.8; letter-spacing:-.08em; pointer-events:none; }
  .ghost span { position:absolute; inset:0; animation-duration:8s; animation-fill-mode:both; animation-timing-function:steps(1,end); }
  .g1 { animation-name:g1; }
  .g2 { animation-name:g2; }
  .g3 { animation-name:g3; }
  @keyframes g1 { 0%,32% { opacity:1 } 32.1%,100% { opacity:0 } }
  @keyframes g2 { 0%,32% { opacity:0 } 32.1%,65% { opacity:1 } 65.1%,100% { opacity:0 } }
  @keyframes g3 { 0%,65% { opacity:0 } 65.1%,100% { opacity:1 } }

  .spacer { flex:1; }

  .board { display:grid; grid-template-columns:1.15fr 2.1fr .95fr; font-family:"Courier New", monospace;
           font-size:1.95vmin; letter-spacing:.06em; text-transform:uppercase; margin-bottom:5vmin; position:relative; z-index:2;
           flex:none; }
  .cell { padding:1.55vmin 0; border-top:1px solid rgba(17,17,16,.24); overflow:hidden; }
  .cell > span { display:block; transform:translateY(130%); animation:riseCell .7s both; }
  .head .cell { border-top:1px solid var(--ink); font-size:1.35vmin; letter-spacing:.18em; color:rgba(17,17,16,.55); padding-bottom:1.1vmin; }
  .head .cell > span { transform:none; animation:fade .5s both; }
  .r1 .cell > span { animation-delay:1.5s; }
  .r2 .cell > span { animation-delay:1.72s; }
  .r3 .cell > span { animation-delay:1.94s; color:var(--red); }
  .r3 .cell { border-bottom:1px solid var(--ink); }

  .rail { position:relative; height:12vmin; flex:none; }
  .track { position:absolute; left:0; right:0; top:3vmin; height:1px; background:rgba(17,17,16,.22); }
  .line { position:absolute; left:0; right:0; top:2.75vmin; height:3px; background:var(--red);
          transform-origin:left; animation:draw 5.1s .9s cubic-bezier(.62,.02,.2,1) both; }
  .train { position:absolute; top:1.55vmin; width:7vmin; height:2.8vmin; background:var(--ink);
           animation:travel 5.1s .9s cubic-bezier(.62,.02,.2,1) both; z-index:2; }
  .train::after { content:''; position:absolute; left:-2.2vmin; top:50%; width:1.8vmin; height:1px; background:var(--ink); }
  .stops { position:absolute; left:0; right:0; top:5vmin; display:flex; justify-content:space-between;
           font:500 1.35vmin/1 "Courier New", monospace; letter-spacing:.14em; color:rgba(17,17,16,.55); text-transform:uppercase; }
  .stops span { position:relative; padding-top:1.3vmin; animation:fade .5s both; }
  .stops span::before { content:''; position:absolute; top:0; left:0; width:1px; height:.9vmin; background:var(--ink); }
  .stops span:nth-child(1) { animation-delay:1.2s; }
  .stops span:nth-child(2) { animation-delay:2.6s; }
  .stops span:nth-child(3) { animation-delay:4s; }
  .stops span:nth-child(4) { animation-delay:5.2s; }

  .foot { display:flex; justify-content:space-between; gap:4vmin; align-items:baseline; margin-top:3.4vmin;
          border-top:1px solid var(--ink); padding-top:2.2vmin; flex:none;
          font:500 1.4vmin/1.5 "Courier New", monospace; letter-spacing:.16em; text-transform:uppercase; }
  .foot b { color:var(--red); font-weight:700; animation:blink 2.4s 5.6s steps(1,end) infinite; }

  @media (min-aspect-ratio: 1/1) {
    .frame { padding:6vmin 7vmin; }
    .mast { margin-top:4.2vmin; }
    h1 { font-size:18.8vmin; }
    .sub { margin-top:2.2vmin; }
    .board { font-size:1.75vmin; margin-bottom:3.2vmin; }
    .cell { padding:1.05vmin 0; }
    .head .cell { padding-bottom:.7vmin; }
    .rail { height:10.5vmin; }
    .stops { top:4.6vmin; }
    .foot { margin-top:2.6vmin; padding-top:1.7vmin; }
  }

  @keyframes draw { from { transform:scaleX(0) } to { transform:scaleX(1) } }
  @keyframes rise { from { transform:translateY(115%) } to { transform:translateY(0) } }
  @keyframes riseCell { from { transform:translateY(240%) } to { transform:translateY(0) } }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  @keyframes travel { from { left:0 } to { left:calc(100% - 7vmin) } }
  @keyframes ring { 0% { transform:scale(.4); opacity:1 } 100% { transform:scale(1.35); opacity:0 } }
  @keyframes blink { 0%,70% { opacity:1 } 71%,100% { opacity:.35 } }
</style>
</head>
<body>
<div class="frame">
  <div class="top">
    <div>Final service<br>One way only</div>
    <div class="right">SN—08 / 23:58<br>National rail</div>
  </div>
  <div class="rule"></div>

  <div class="mast">
    <div class="mask"><h1 class="l1">Last</h1></div>
    <div class="mask"><h1 class="l2">Train</h1></div>
    <div class="sub"><i></i><span>Platform 2</span><span>Departs 00:00</span></div>
  </div>

  <div class="ghost" aria-hidden="true">
    <span class="g1">03</span><span class="g2">02</span><span class="g3">01</span>
  </div>

  <div class="spacer"></div>

  <div class="board">
    <div class="head" style="display:contents">
      <div class="cell"><span>Time</span></div>
      <div class="cell"><span>Destination</span></div>
      <div class="cell"><span>Platform</span></div>
    </div>
    <div class="r1" style="display:contents">
      <div class="cell"><span>23:58</span></div>
      <div class="cell"><span>Northgate</span></div>
      <div class="cell"><span>02</span></div>
    </div>
    <div class="r2" style="display:contents">
      <div class="cell"><span>00:04</span></div>
      <div class="cell"><span>Harbour</span></div>
      <div class="cell"><span>01</span></div>
    </div>
    <div class="r3" style="display:contents">
      <div class="cell"><span>00:11</span></div>
      <div class="cell"><span>Terminus</span></div>
      <div class="cell"><span>03</span></div>
    </div>
  </div>

  <div class="rail">
    <div class="track"></div>
    <div class="line"></div>
    <div class="train"></div>
    <div class="stops"><span>Central</span><span>River</span><span>Northgate</span><span>Terminus</span></div>
  </div>

  <div class="foot">
    <span><b>Mind the gap.</b></span>
    <span>Doors close 30s before departure</span>
  </div>
</div>
</body>
</html>
